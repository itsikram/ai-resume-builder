# Render blueprint (optional alternative host). The API serves the built client,
# so a single web service is enough. See docs/DEPLOY_GODADDY.md for cPanel hosting.
services:
  - type: web
    name: aicvbuilderbd
    env: node
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client && npm run build:server --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://aicvbuilderbd.online
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: DISABLE_REDIS
        value: true
